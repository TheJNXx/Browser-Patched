name: Generate Keystore (run once, then delete this file)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'release'
      key_password:
        description: 'Password for the key and the keystore'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the password so it never shows up in the log
        run: echo "::add-mask::${{ inputs.key_password }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate the keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.key_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Brave Patched, OU=Personal, O=Personal, L=Unknown, ST=Unknown, C=US"

      - name: Base64-encode it
        run: base64 -w 0 release.keystore > keystore_base64.txt

      - name: Upload as a short-lived artifact (never printed to the log)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1

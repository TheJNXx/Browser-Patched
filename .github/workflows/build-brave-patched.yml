name: Build Patched Brave

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install build-tools (for apksigner)
        run: |
          yes | sdkmanager --install "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Get latest patch info from kveld9
        id: patch_info
        run: |
          curl -sL --fail -o patches-list.json \
            "https://raw.githubusercontent.com/kveld9/kveld-morphe-patches/main/patches-list.json"

          # kveld9's repo also ships patches for Vivaldi, Gboard, Hevy and TikTok,
          # and releases very often. Isolate only the patches that actually target
          # Brave, and fingerprint just those, so an unrelated release doesn't
          # trigger a rebuild here.
          BRAVE_PATCHES=$(jq -S '
            [.patches[] | select(.compatiblePackages[]?.packageName == "com.brave.browser")]
          ' patches-list.json)

          BRAVE_VERSION=$(echo "$BRAVE_PATCHES" | jq -r '
            [.[].compatiblePackages[]?
              | select(.packageName == "com.brave.browser")
              | .targets[].version
            ] | unique | .[0]
          ')

          BRAVE_PATCH_HASH=$(echo "$BRAVE_PATCHES" | sha256sum | cut -d' ' -f1)

          RESPONSE=$(curl -s https://api.github.com/repos/kveld9/kveld-morphe-patches/releases/latest)
          PATCH_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          PATCH_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name | test("\\.mpp$")) | .browser_download_url' | head -1)

          if [ -z "$PATCH_URL" ] || [ -z "$BRAVE_VERSION" ] || [ "$BRAVE_VERSION" == "null" ]; then
            echo "::error::Could not extract the patch URL or the required Brave version."
            exit 1
          fi

          echo "kveld_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "patch_url=$PATCH_URL" >> "$GITHUB_OUTPUT"
          echo "brave_version=$BRAVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "brave_patch_hash=$BRAVE_PATCH_HASH" >> "$GITHUB_OUTPUT"

      - name: Check against already published releases
        id: check_state
        run: |
          TAG="brave-${{ steps.patch_info.outputs.brave_version }}"
          PATCH_HASH="${{ steps.patch_info.outputs.brave_patch_hash }}"

          RELEASE_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body,assets 2>/dev/null || echo "")

          if [ -z "$RELEASE_JSON" ]; then
            echo "No release yet for this Brave version, building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '.assets | length')
            HAS_CURRENT_PATCH=$(echo "$RELEASE_JSON" | jq --arg hash "$PATCH_HASH" '.body | contains($hash)')

            if [ "$ASSET_COUNT" -gt 0 ] && [ "$HAS_CURRENT_PATCH" == "true" ]; then
              echo "Release already up to date with Brave's current patches, skipping build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release is missing its APK or Brave's patches changed, (re)building."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Brave (exact-version BraveMonoarm64.apk)
        if: steps.check_state.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.patch_info.outputs.brave_version }}"
          curl -sL --fail -o brave-original.apk \
            "https://github.com/brave/brave-browser/releases/download/v${VERSION}/BraveMonoarm64.apk"

      - name: Download the .mpp patch bundle
        if: steps.check_state.outputs.skip == 'false'
        run: curl -sL --fail -o patches.mpp "${{ steps.patch_info.outputs.patch_url }}"

      - name: Download official Morphe CLI (morphe-desktop)
        if: steps.check_state.outputs.skip == 'false'
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest \
            | jq -r '.assets[] | select(.name | test("all\\.jar$")) | .browser_download_url')
          curl -sL --fail -o morphe-cli.jar "$CLI_URL"

      - name: Decode keystore
        if: steps.check_state.outputs.skip == 'false'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Patch
        if: steps.check_state.outputs.skip == 'false'
        run: |
          java -jar morphe-cli.jar patch \
            -p patches.mpp \
            -o brave-patched-unsigned.apk \
            brave-original.apk

      - name: Sign with your own key
        if: steps.check_state.outputs.skip == 'false'
        run: |
          apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out brave-patched.apk \
            brave-patched-unsigned.apk

      - name: Delete keystore from the runner
        if: always()
        run: rm -f release.keystore

      - name: Compute checksum
        if: steps.check_state.outputs.skip == 'false'
        id: checksum
        run: |
          sha256sum brave-patched.apk > brave-patched.apk.sha256
          echo "sha256=$(cut -d' ' -f1 brave-patched.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Publish release with the APK
        if: steps.check_state.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "brave-${{ steps.patch_info.outputs.brave_version }}"
          name: "Brave ${{ steps.patch_info.outputs.brave_version }}"
          body: "Patched with kveld9's Morphe patches ${{ steps.patch_info.outputs.kveld_tag }} — https://github.com/kveld9/kveld-morphe-patches/releases/tag/${{ steps.patch_info.outputs.kveld_tag }}\n\nBrave patch fingerprint: ${{ steps.patch_info.outputs.brave_patch_hash }}\n\nSHA256: `${{ steps.checksum.outputs.sha256 }}`"
          files: |
            brave-patched.apk
            brave-patched.apk.sha256
          overwrite_files: true
